name: Daily dashboard refresh

on:
  schedule:
    # Kaggle dataset updates ~08:00 UTC daily; run with buffer.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      request_budget:
        description: "YouTube API requests this run (x50 videos each; free quota ~9500/day)"
        required: false
        default: "6000"

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write # to persist the enrichment store as a release asset

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk (drop unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          pip install -r pipeline/requirements.txt kaggle

      - name: Download fresh Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Kaggle's API occasionally 404s transiently (e.g. mid-update);
          # retry up to 3 times, 10 minutes apart, before giving up the day.
          for attempt in 1 2 3; do
            if kaggle datasets download asaniczka/trending-youtube-videos-113-countries \
              -p pipeline/raw_data --unzip; then
              break
            fi
            if [ "$attempt" = "3" ]; then echo "download failed after 3 attempts"; exit 1; fi
            echo "download attempt $attempt failed; retrying in 10 minutes"
            sleep 600
          done
          ls -lh pipeline/raw_data

      - name: Ingest into DuckDB (then delete the CSV to free disk)
        run: |
          python pipeline/ingest_kaggle.py --db pipeline/warehouse/ci.duckdb
          rm -f pipeline/raw_data/*.csv pipeline/raw_data/*.zip
          df -h /

      - name: Restore enrichment store (accumulated across runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download enrichment-store -p enrichment_store.parquet \
            -D pipeline/raw_data --clobber \
            || cp pipeline/seeds/april_enrichment.parquet pipeline/raw_data/enrichment_store.parquet
          ls -lh pipeline/raw_data/enrichment_store.parquet

      - name: Enrich next slice via YouTube API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_MAX_REQUESTS_PER_RUN: ${{ inputs.request_budget || '6000' }}
        run: |
          python pipeline/runner.py --db pipeline/warehouse/ci.duckdb \
            --select youtube_enrichment_candidates --skip-tests
          python pipeline/enrich_step.py \
            --db pipeline/warehouse/ci.duckdb \
            --store pipeline/raw_data/enrichment_store.parquet

      - name: Persist enrichment store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload enrichment-store \
            pipeline/raw_data/enrichment_store.parquet --clobber

      - name: Run pipeline (gc mode caps peak disk)
        run: |
          python pipeline/runner.py --db pipeline/warehouse/ci.duckdb --gc \
            --stub-parquet read_youtube_video_enrichment=pipeline/raw_data/enrichment_store.parquet \
            --exclude inspect_youtube_videos_payload
          df -h /

      - name: Export dashboard data
        run: |
          python pipeline/export_dashboard_data.py \
            --db pipeline/warehouse/ci.duckdb \
            --out dashboard-live/src/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dashboard
        working-directory: dashboard-live
        run: |
          npm ci
          npm run build

      - name: Deploy to Netlify (same URL)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy --prod --dir dashboard-live/dist \
            --message "Daily data refresh $(date -u +%F)"

      - name: Run summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import duckdb
          con = duckdb.connect("pipeline/warehouse/ci.duckdb", read_only=True)
          k = con.execute("SELECT * FROM analytics.dashboard1_monetization_kpis").fetchdf().iloc[0]
          n, dmax = con.execute('SELECT count(*), max(snapshot_date) FROM "YouTube Trending Videos".trending_videos').fetchone()
          import pandas as pd
          store = pd.read_parquet("pipeline/raw_data/enrichment_store.parquet")
          enriched = (store["status"] == "processed").sum()
          print("### Daily refresh complete\n")
          print(f"- Raw rows: **{n:,}** (through {dmax})")
          print(f"- Enrichment store: **{enriched:,}** videos enriched")
          print(f"- Platform health index: **{k['avg_platform_health_index']}**")
          print(f"- Avg monthly est. revenue: **${k['avg_monthly_estimated_revenue']:,.0f}**")
          print(f"- Unique videos: **{int(k['total_unique_videos']):,}**")
          EOF
